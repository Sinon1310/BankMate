# BankMate design system — base theme.
# Tokens here must stay in sync with ui/theme.py (TOKENS).

[client]
toolbarMode = "minimal"

[theme]
base = "light"

primaryColor = "#2E5BFF"
backgroundColor = "#F7F5F0"
secondaryBackgroundColor = "#F0EDE6"
textColor = "#0B1B3A"
borderColor = "#E3DED4"
showWidgetBorder = true

linkColor = "#2E5BFF"
linkUnderline = false

blueColor = "#2E5BFF"
violetColor = "#7C5CFF"
greenColor = "#0F8A5F"
orangeColor = "#C2410C"
redColor = "#D92D20"
grayColor = "#8A93A6"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&display=swap, Inter, sans-serif"
baseFontSize = 15
headingFontSizes = ["2.125rem", "1.5rem", "1.125rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

baseRadius = "0.75rem"
buttonRadius = "0.625rem"

dataframeBorderColor = "#E3DED4"
dataframeHeaderBackgroundColor = "#F4F1EB"

# Order validated for colour-blind separation on white (all checks pass).
chartCategoricalColors = ["#2E5BFF", "#C2410C", "#7C5CFF", "#0F8A5F"]

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F3EE"
borderColor = "#ECE8E0"
