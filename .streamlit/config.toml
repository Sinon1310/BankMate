# BankMate design system — base theme.
# Tokens here must stay in sync with ui/theme.py (TOKENS).

[client]
toolbarMode = "minimal"
# Never show tracebacks or exception details in the browser; they are
# printed to the server console. For local debugging, run with
# STREAMLIT_CLIENT_SHOW_ERROR_DETAILS=full.
showErrorDetails = "none"

[theme]
base = "dark"

primaryColor = "#5B8CFF"
backgroundColor = "#0A101C"
secondaryBackgroundColor = "#111A2C"
textColor = "#E7ECF5"
borderColor = "#1F2B42"
showWidgetBorder = true

linkColor = "#7AA2FF"
linkUnderline = false

blueColor = "#5B8CFF"
violetColor = "#A855F7"
greenColor = "#0D9488"
orangeColor = "#D97706"
redColor = "#F87171"
grayColor = "#6E7B93"

font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter Tight:https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&display=swap, Inter, sans-serif"
baseFontSize = 15
headingFontSizes = ["1.75rem", "1.25rem", "1.0625rem", "1rem", "0.9375rem", "0.875rem"]
headingFontWeights = [700, 600, 600, 600, 600, 600]

baseRadius = "0.75rem"
buttonRadius = "0.625rem"

dataframeBorderColor = "#1F2B42"
dataframeHeaderBackgroundColor = "#16213A"

# Order validated for colour-blind separation on the dark surface #111A2C
# (dataviz validate_palette.js: all checks pass).
chartCategoricalColors = ["#5B8CFF", "#D97706", "#0D9488", "#A855F7"]

[theme.sidebar]
backgroundColor = "#0D1423"
secondaryBackgroundColor = "#111A2C"
borderColor = "#1A2539"
